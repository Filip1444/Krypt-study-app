name: Build KRYPT

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows release
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux release
        run: npm run dist:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release_linux/*.AppImage
            release_linux/*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KRYPT ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/windows/*.exe
            dist/linux/*.AppImage
            dist/linux/*.deb
          body: |
            ## KRYPT ${{ github.ref_name }}

            ### What's new
            - Reorder subjects by dragging or with the keyboard; the order is saved.
            - Color-coded grades and consistent rounded-grade target checks.
            - English and Croatian interface options, plus data backup and recovery improvements.
            - Polished dialogs and subject movement, with reduced-motion support.

            ### Downloads
            - Windows: installer and portable executable (`.exe`)
            - Linux: portable AppImage (`.AppImage`) and Debian package (`.deb`)
